<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; connect-src 'none'; base-uri 'none'; form-action 'none'">
  <title>Encrypted API key</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; padding: 24px; min-height: 100vh; display: grid; place-items: center; background: #f4f4f2; color: #202124; font: 16px/1.5 system-ui, sans-serif; }
    main { width: 100%; max-width: 540px; padding: 32px; border: 1px solid #ddd; border-radius: 20px; background: #fff; }
    h1 { margin: 0 0 8px; font-size: 26px; letter-spacing: -.6px; }
    p { color: #62666b; margin: 0 0 24px; }
    label { display: block; margin-bottom: 8px; font-weight: 600; }
    input, textarea { width: 100%; padding: 12px; border: 1px solid #c6c9ce; border-radius: 8px; font: inherit; }
    textarea { min-height: 110px; font-family: ui-monospace, monospace; resize: vertical; }
    input:focus, textarea:focus { outline: 3px solid #b9d4ff; border-color: #2463cf; }
    button { margin-top: 16px; padding: 12px 18px; border: 0; border-radius: 8px; background: #1f2328; color: white; font: inherit; font-weight: 600; cursor: pointer; }
    button:disabled { opacity: .6; cursor: wait; }
    .secondary { background: #edf0f3; color: #202124; margin-left: 8px; }
    #status { min-height: 24px; margin-top: 16px; margin-bottom: 0; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
<main>
  <h1>Encrypted API key</h1>
  <p>Enter the password to reveal the saved key. Decryption happens in this browser.</p>
  <form id="unlock-form">
    <label for="password">Password</label>
    <input id="password" type="password" autocomplete="off" required spellcheck="false">
    <button id="unlock" type="submit">Reveal key</button>
  </form>
  <section id="result" hidden>
    <label for="key">API key</label>
    <textarea id="key" readonly spellcheck="false"></textarea>
    <button id="copy" type="button">Copy key</button>
    <button id="lock" class="secondary" type="button">Lock</button>
  </section>
  <p id="status" role="status" aria-live="polite"></p>
</main>
<script id="encrypted-payload" type="application/json">{"version":1,"iterations":600000,"salt":"hI5Ip14YrksThNHx+3kDlCeEBLoWmKWS+J8kn+7AKxk=","nonce":"Q97fH6FpvdU0XN7K","ciphertext":"CmUzGId/4mCAH0HosCZbKs9HXjk1LHth6Tgj5sRav8020wffSXQKXMU471epLMN/2b7vBowAqGzXKuwLEAdXLjz+wC6B"}</script>
<script>
const payload = JSON.parse(document.getElementById('encrypted-payload').textContent);
const form = document.getElementById('unlock-form');
const passwordInput = document.getElementById('password');
const unlock = document.getElementById('unlock');
const result = document.getElementById('result');
const keyOutput = document.getElementById('key');
const status = document.getElementById('status');
const decode = value => Uint8Array.from(atob(value), char => char.charCodeAt(0));

form.addEventListener('submit', async event => {
  event.preventDefault();
  if (!globalThis.crypto?.subtle) {
    status.textContent = 'Download this HTML file and open it in a current browser.';
    return;
  }
  unlock.disabled = true;
  status.textContent = 'Unlocking…';
  try {
    const material = await crypto.subtle.importKey(
      'raw', new TextEncoder().encode(passwordInput.value), 'PBKDF2', false, ['deriveKey']
    );
    const key = await crypto.subtle.deriveKey(
      { name: 'PBKDF2', salt: decode(payload.salt), iterations: payload.iterations, hash: 'SHA-256' },
      material, { name: 'AES-GCM', length: 256 }, false, ['decrypt']
    );
    const decrypted = await crypto.subtle.decrypt(
      { name: 'AES-GCM', iv: decode(payload.nonce), tagLength: 128 }, key, decode(payload.ciphertext)
    );
    keyOutput.value = new TextDecoder().decode(decrypted);
    passwordInput.value = '';
    form.hidden = true;
    result.hidden = false;
    status.textContent = 'Key unlocked.';
    keyOutput.focus();
    keyOutput.select();
  } catch {
    status.textContent = 'Incorrect password or damaged file.';
  } finally {
    unlock.disabled = false;
  }
});

document.getElementById('copy').addEventListener('click', async () => {
  try {
    await navigator.clipboard.writeText(keyOutput.value);
    status.textContent = 'Key copied.';
  } catch {
    keyOutput.focus();
    keyOutput.select();
    status.textContent = 'Select the key and copy it with your keyboard.';
  }
});

document.getElementById('lock').addEventListener('click', () => {
  keyOutput.value = '';
  result.hidden = true;
  form.hidden = false;
  status.textContent = '';
  passwordInput.focus();
});
</script>
</body>
</html>
